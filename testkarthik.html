<style>
/* ==========================================================================
STARZPLAY — MAROC TELECOM DCB · SERIE A FREE TRIAL
CleverTap Custom HTML In-App · INTERSTITIAL · ANDROID

VARIANT B — free trial + "then 17.5 MAD/week".
The A file is byte-identical except CONFIG.variant = 'A'.

Palette + component treatment lifted from serie-a-team-picker.html
(STARZPLAY Colour Guidance book).

Copy follows the live Maroc Telecom DCB page in EN and AR — same offer
wording, same benefit trio, same eligibility and renewal lines, and
"Maroc Telecom" left in Latin inside Arabic exactly as the page does.

The "switch to mobile data" notice has been REMOVED. The DCB page
authenticates with MSISDN + OTP, not network header enrichment, so
connection type does not affect signup. See README.

NO CLOSE BUTTON: CleverTap renders its own. The top bar keeps 52px clear
on BOTH sides so the native close cannot collide in LTR or RTL.
========================================================================== */
:root {
--sp-accent: #7AFFFB; /* Accent · Pantone 318 C */
--sp-focus: #FFFFFF; /* Focus · primary buttons */
--sp-slate: #424242; /* Slate · secondary / disabled */
--sp-body: #000000; /* Body · mobile background */
--sp-pop: #1A1A1A; /* Pop · pop-ups / drawers */
--sp-light: #FFFFFF;
--sp-fade: #D4D1D1;
--sp-w06: rgba(255,255,255,0.06);
--sp-w12: rgba(255,255,255,0.12);
--sp-grad: linear-gradient(120deg, var(--sp-light) 0%, var(--sp-accent) 100%);

/* Averta has no Arabic coverage, so RTL uses the platform Arabic face —
no network cost and better shaping than any Latin fallback. */
--sp-font: 'Averta', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
--sp-font-ar: 'SF Arabic', 'Geeza Pro', 'Noto Sans Arabic', 'Noto Naskh Arabic',
'Tajawal', -apple-system, 'Helvetica Neue', Arial, sans-serif;

--sp-pad-x: 16px;
--sp-safe-top: max(env(safe-area-inset-top, 0px), 8px);
--sp-safe-bottom: max(env(safe-area-inset-bottom, 0px), 8px);
--sp-safe-left: env(safe-area-inset-left, 0px);
--sp-safe-right: env(safe-area-inset-right, 0px);

--sp-tile-w: clamp(148px, 44vw, 192px); /* row A · landscape 1400x600 */
--sp-tile-w-b: clamp(72px, 22vw, 96px); /* row B · portrait 475x675 */

/* Gap between the rounded panel and the physical screen edge. Safe-area
insets are applied HERE, once, on .sp-root — so nothing inside needs to
know about the notch. */
--sp-inset: 10px;
}

*, *::before, *::after { box-sizing: border-box; }
/* Transparent, NOT black. A rounded panel only reads as rounded if the page
behind it lets CleverTap's overlay show through the corners. Requires the
campaign's overlay style to be Transparent — see README setup step 4. */
html, body {
margin: 0; padding: 0; height: 100%;
background: transparent;
overflow: hidden; overscroll-behavior: none;
}
body {
font-family: var(--sp-font);
color: var(--sp-light);
-webkit-tap-highlight-color: transparent;
}
html[dir="rtl"] body { font-family: var(--sp-font-ar); }

.sp-root {
position: fixed;
top: calc(var(--sp-safe-top) + var(--sp-inset));
bottom: calc(var(--sp-safe-bottom) + var(--sp-inset));
left: calc(var(--sp-safe-left) + var(--sp-inset));
right: calc(var(--sp-safe-right) + var(--sp-inset));
display: flex; flex-direction: column;
background: var(--sp-body);
border: 1px solid var(--sp-w12);
border-radius: 26px;
/* Clips the hero backdrop and both full-bleed reels to the rounded corners. */
overflow: hidden;
/* FAILSAFE VISIBILITY.
The panel fades in when boot() adds .is-ready. But if ANY JS throws before
that line, a root stuck at opacity:0 means a fully invisible in-app that
still overlays the app and swallows taps — and with a transparent body
there is not even a black box to hint it is there.
So the reveal also happens from CSS after 1.2s, regardless of JS. CSS
cannot fail the way script can, so the user always sees something. */
opacity: 0; transition: opacity .22s ease;
animation: spReveal .01s linear 1.2s forwards;
}
.sp-root.is-ready { opacity: 1; animation: none; }
@keyframes spReveal { to { opacity: 1; } }

/* Hero backdrop. Paints only once decoded, so a slow or failed load degrades
to plain black rather than a half-painted photo. */
.sp-hero {
position: absolute; inset: 0; z-index: 0;
background-position: top center; background-repeat: no-repeat;
background-size: cover;
opacity: 0; transition: opacity .45s ease;
pointer-events: none;
}
.sp-hero.is-on { opacity: 1; }
.sp-hero::after {
content: ''; position: absolute; inset: 0;
background: linear-gradient(to bottom,
rgba(0,0,0,0.18) 0%,
rgba(0,0,0,0.50) 14%,
rgba(0,0,0,0.86) 28%,
#000 42%);
}
.sp-head, .sp-stage, .sp-foot { position: relative; z-index: 1; }

/* ---------- Header ---------- */
.sp-head {
flex: 0 0 auto; text-align: center;
padding: 12px var(--sp-pad-x) 2px;
}
/* 52px clear on both sides: CleverTap's own close button lives up here. */
.sp-bar {
display: flex; align-items: center; justify-content: center;
min-height: 38px; padding-inline: 52px;
}
/* The switcher keeps LTR order (AR · FR · EN) in every language, so the pill
you just tapped does not jump across the screen when the layout mirrors. */
.sp-lang {
display: flex; direction: ltr;
background: var(--sp-w06);
border: 1px solid var(--sp-w12); border-radius: 999px; padding: 2px;
}
.sp-lang-btn {
min-width: 44px; min-height: 32px; padding: 0 12px;
display: flex; align-items: center; justify-content: center;
background: transparent; border: 0; border-radius: 999px;
color: var(--sp-fade); font-family: var(--sp-font);
font-size: .75rem; font-weight: 700; cursor: pointer;
}
.sp-lang-btn[lang="ar"] { font-family: var(--sp-font-ar); font-size: .8125rem; }
.sp-lang-btn[aria-pressed="true"] { background: var(--sp-light); color: #000; }
.sp-lang-btn:focus-visible { outline: 3px solid var(--sp-accent); outline-offset: 2px; }

.sp-complogo { height: 40px; width: auto; display: block; margin: 8px auto 0; }

/* ---------- Stage ---------- */
.sp-stage {
flex: 1 1 auto; min-height: 0;
display: flex; flex-direction: column;
/* NOT justify-content:center. Centring a scrollable flex container clips the
overflow at the TOP and makes it unreachable — on a 320x568 screen that
silently ate the first reel row. Auto margins on the end children absorb
only POSITIVE free space, so the block centres when there is room and
collapses to flush-top when there is not. */
justify-content: flex-start;
/* Safety valve for short viewports. Scrollbar hidden because a visible
track on a full-bleed black interstitial reads as a rendering fault. */
overflow-y: auto;
scrollbar-width: none;
padding: 4px 0 8px 0;
text-align: center;
}
.sp-stage::-webkit-scrollbar { width: 0; height: 0; display: none; }
.sp-stage > :first-child { margin-top: auto; }
.sp-stage > :last-child { margin-bottom: auto; }
.sp-card {
width: 100%; max-width: 460px; margin: 0 auto; min-width: 0;
padding-left: var(--sp-pad-x); padding-right: var(--sp-pad-x);
}

.sp-title {
margin: 4px auto 0; max-width: 20ch;
font-size: clamp(1.75rem, 8.6vw, 2.375rem);
font-weight: 900; line-height: 1.08; letter-spacing: -.015em;
background: var(--sp-grad);
-webkit-background-clip: text; background-clip: text;
-webkit-text-fill-color: transparent; color: var(--sp-light);
}
html[dir="rtl"] .sp-title { letter-spacing: normal; line-height: 1.26; }

/* Price pill — variant B only. Accent-ruled so the number is impossible to
miss; the brief is explicit that the price must not be buried. Wording is
taken verbatim from the DCB page. */
.sp-price {
display: none;
margin: 10px auto 0; padding: 6px 15px;
border: 1px solid rgba(122,255,251,0.45); border-radius: 999px;
background: rgba(122,255,251,0.10);
color: var(--sp-accent);
font-size: clamp(.875rem, 4vw, 1rem); font-weight: 700; line-height: 1.3;
}
.sp-root.is-priced .sp-price { display: inline-block; }

.sp-body {
margin: 10px auto 0; max-width: 34ch;
font-size: clamp(.8125rem, 3.6vw, .9375rem); line-height: 1.45; color: var(--sp-fade);
}

/* ---------- Key-art reel ----------
Continuous CSS marquee, no JS timers. The tile list is rendered TWICE and
the track shifts by exactly one repeat unit, so the loop has no snap.

Sources are the 1400x600 key-art set — every one of them is exactly 2.33,
so a landscape strip crops nothing. Tiles are sized from a single width
variable rather than aspect-ratio: no dependency on newer CSS, no risk of
the row collapsing to zero height in an older webview.

The 44s duration is deliberate. The loop covers ~10 tile widths, which works
out around 40px/s — slow enough to read a title as it passes. */
.sp-reel {
position: relative; margin-top: 14px;
overflow: hidden;
/* min-width:0 is load-bearing. As a flex item the default min-width:auto is
the track's content size (~1120px), which drags the whole layout wider
than the viewport and scrolls the body sideways. overflow:hidden does not
prevent that — only this does. */
width: 100%; min-width: 0;
/* LTR on the CONTAINER, not just the track. An overflowing child is
right-aligned in RTL, so the track would start at (reel - track) = -553px
and the animation would translate a further -560 on top of that, sliding
the strip almost entirely off-screen. Anchoring the container LTR keeps
the track's static offset at 0 in both directions. The posters carry no
reading order, so an LTR strip is not an RTL defect — travel direction is
still mirrored, below. */
direction: ltr;
/* Fade both edges so posters dissolve instead of hard-cutting at the bezel.
Logical inset would be pointless here — the strip is symmetric. */
-webkit-mask-image: linear-gradient(to right, transparent, #000 9%, #000 91%, transparent);
mask-image: linear-gradient(to right, transparent, #000 9%, #000 91%, transparent);
}
.sp-reel.is-empty { display: none; }
/* NO `gap` here on purpose. With gap, 10 tiles measure 10w + 9g, and half of
that is 4px short of the true repeat unit 5(w+g) — so a -50% loop stutters
every cycle. Spacing lives on the tile's margin-right instead, making the
track exactly 10(w+g) and -50% exactly one repeat. */
.sp-reel-track {
display: flex; width: max-content;
direction: ltr; /* transform maths stays LTR in both dirs */
animation: spReel 44s linear infinite;
}
/* In RTL the reel travels the other way, matching the reading direction. */
html[dir="rtl"] .sp-reel-track { animation-direction: reverse; }
/* Row B counter-scrolls at a different speed, so the two rows drift apart
instead of marching in lockstep. Direction is inverted relative to row A in
BOTH text directions. */
.sp-reel-b { margin-top: 8px; }
.sp-reel-b .sp-reel-track {
animation-direction: reverse;
animation-duration: 53s;
/* Negative delay starts row B mid-cycle. Together with the reversed list,
the opposite travel direction and the coprime-ish duration, this stops the
two rows from showing the same title abreast for more than a moment. */
animation-delay: -19s;
}
html[dir="rtl"] .sp-reel-b .sp-reel-track { animation-direction: normal; }
/* End value is an EXACT five-tile shift, not -50%. A percentage is relative to
the track's own width, so it silently changes meaning if the number of
copies changes; this is pinned to one repeat unit and stays seamless whether
the track holds two copies or three. */
/* One keyframe, two rows. Each row declares its own --sp-shift = one repeat
unit (tile count x tile pitch), which the track inherits. A shared -50%
could not work here: the rows hold different tile counts AND different
widths, so their repeat units differ. */
@keyframes spReel {
from { transform: translateX(0); }
to { transform: translateX(calc(var(--sp-shift) * -1)); }
}
.sp-reel { --sp-shift: calc((var(--sp-tile-w) + 8px) * 10); }
.sp-reel-b { --sp-shift: calc((var(--sp-tile-w-b) + 8px) * 5); }

.sp-tile {
flex: 0 0 auto;
width: var(--sp-tile-w);
height: calc(var(--sp-tile-w) * 600 / 1400); /* 2.33 key art */
margin-right: 8px; /* see the note on .sp-reel-track */
border-radius: 10px; overflow: hidden;
background: var(--sp-w06);
border: 1px solid var(--sp-w06);
}
/* Row B is the portrait poster set — a different ratio as well as different
titles, so the two strips never look like the same content twice. */
.sp-reel-b .sp-tile {
width: var(--sp-tile-w-b);
height: calc(var(--sp-tile-w-b) * 675 / 475); /* 0.70 posters */
}
.sp-tile.is-dead { display: none; }
.sp-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* ---------- Benefit trio (wording from the DCB page) ---------- */
.sp-bens {
display: flex; align-items: flex-start; justify-content: center;
gap: 6px; margin: 14px auto 0; max-width: 400px;
}
.sp-ben {
flex: 1 1 0; min-width: 0;
display: flex; flex-direction: column; align-items: center; gap: 5px;
}
.sp-ben svg { display: block; color: var(--sp-accent); flex: 0 0 auto; }
.sp-ben span {
font-size: clamp(.625rem, 2.8vw, .75rem); line-height: 1.25; color: var(--sp-fade);
overflow-wrap: break-word;
}

/* ---------- Footer ---------- */
.sp-foot {
flex: 0 0 auto;
padding: 10px var(--sp-pad-x) 12px;
border-top: 1px solid var(--sp-w06);
}
.sp-cta {
display: flex; align-items: center; justify-content: center; gap: 8px;
width: 100%; max-width: 460px; margin: 0 auto; min-height: 54px;
padding: 8px 16px;
background: var(--sp-focus); color: #000;
border: 0; border-radius: 10px;
font: inherit; font-size: clamp(.9375rem, 4vw, 1.0625rem); font-weight: 700;
text-align: center; text-decoration: none; cursor: pointer;
transition: transform .12s ease;
}
.sp-cta:active { transform: scale(.98); }
.sp-cta:focus-visible { outline: 3px solid var(--sp-accent); outline-offset: 2px; }

/* "Not now" is a real button: full width, 46px tall, visible border, same type
size as the fine print rather than a grey whisper. Not a dark pattern. */
/* Deliberately smaller than the CTA, but still a 44px target with a visible
border and full-size label — secondary, not hidden. */
.sp-dismiss {
display: block; width: 100%; max-width: 240px; margin: 8px auto 0;
min-height: 44px; padding: 6px 16px;
background: transparent; color: var(--sp-fade);
border: 1px solid var(--sp-w12); border-radius: 10px;
font: inherit; font-size: .875rem; font-weight: 700; cursor: pointer;
}
.sp-dismiss:active { background: var(--sp-w06); }
.sp-dismiss:focus-visible { outline: 3px solid var(--sp-accent); outline-offset: 2px; }

/* The constructive exit for an ineligible user. Accent-coloured like the
"Click here" link on the DCB page. */
.sp-alt {
display: block; margin: 10px auto 0; padding: 6px 4px;
font-size: .8125rem; line-height: 1.35; text-align: center;
color: var(--sp-fade); text-decoration: none; cursor: pointer;
}
.sp-alt b { color: var(--sp-accent); font-weight: 700; text-decoration: underline; }
.sp-alt:focus-visible { outline: 3px solid var(--sp-accent); outline-offset: 2px; }

.sp-fine {
display: flex; align-items: center; justify-content: center;
gap: 7px; flex-wrap: wrap;
margin: 8px auto 0; max-width: 460px;
font-size: .6875rem; line-height: 1.35;
color: #8C8C8C; /* Slate (#424242) on black is under 3:1; lifted to stay legible. */
}
.sp-oplogo { height: 20px; width: auto; display: block; border-radius: 2px; }
.sp-optext { display: none; font-weight: 700; color: #8C8C8C; }
.sp-fine.is-noimg .sp-oplogo { display: none; }
.sp-fine.is-noimg .sp-optext { display: inline; }

/* Short viewports (iPhone SE class): trade reel height and logo size for
keeping the CTA above the fold. */
@media (max-height: 640px) {
:root { --sp-tile-w: clamp(130px, 38vw, 160px); --sp-inset: 6px; }
.sp-reel-b { display: none; } /* one row only — protect the CTA */
.sp-root { border-radius: 20px; }
.sp-complogo { height: 30px; margin-top: 4px; }
.sp-head { padding-top: 8px; }
.sp-price { margin-top: 8px; }
.sp-body { margin-top: 8px; }
.sp-alt { margin-top: 6px; }
.sp-fine { margin-top: 6px; }
.sp-foot { padding-top: 8px; padding-bottom: 8px; }
.sp-complogo { height: 32px; }
.sp-title { font-size: clamp(1.5rem, 7.4vw, 1.875rem); }
.sp-reel { margin-top: 10px; }
.sp-bens { margin-top: 10px; }
}

.sp-sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.sp-debug {
position: fixed; inset-inline: 0; bottom: 0; z-index: 99; background: #000; color: #0f0;
font: 10px/1.35 ui-monospace, Menlo, monospace; padding: 4px 6px;
max-height: 34vh; overflow: auto; white-space: pre-wrap; display: none;
direction: ltr; text-align: left;
}
.sp-debug.is-on { display: block; }

@media (prefers-reduced-motion: reduce) {
.sp-root, .sp-hero, .sp-cta { transition: none !important; }
.sp-cta:active { transform: none; }
.sp-reel-track { animation: none !important; }
}
</style>
</head>

<script>
(function () {
'use strict';

/* ==========================================================================
CONFIG
========================================================================== */
var CONFIG = {
/* ---- A/B ---------------------------------------------------------------
THE ONLY LINE THAT DIFFERS BETWEEN THE TWO VARIANT FILES.
'A' = free trial only, no price. 'B' = free trial + weekly price.
---------------------------------------------------------------------- */
variant: 'B',

lang: 'ar', /* Arabic is the default on load */

/* ---- Event + property schema (see README for the conflicts flagged) ---- */
eventName: 'web_exitpop_clm', /* existing event, reused as instructed */
campaignName: 'seriea_dcb_2627', /* existing property name is campaign_name */
triggerSource: 'maroc_telecom_dcb',
placement: 'inapp_interstitial',
channel: 'in_app',
country: 'MA',
carrierTarget: 'maroc_telecom',

/* ---- Destinations ------------------------------------------------------ */
destUrl: 'https://starzplay.com/en/partners/maroc-telecom',
utmCampaign: 'seriea_dcb_2627',

/* Localised DCB paths. OFF because the brief names the /en/ URL explicitly
and the screenshots only evidence EN and AR. Flip to true once infra
confirms the localised routes — see README open question 2. */
localiseDestPath: false,
destPathByLang: {
ar: 'https://starzplay.com/ar/partners/maroc-telecom',
fr: 'https://starzplay.com/fr/partners/maroc-telecom',
en: 'https://starzplay.com/en/partners/maroc-telecom'
},

/* Where a NON Maroc Telecom user goes. AR and EN were supplied; FR falls
back to EN because /fr/landing is unverified (403 behind the WAF, so I
could not confirm it either way). README open question 2. */
landingByLang: {
ar: 'https://starzplay.com/ar/landing',
fr: 'https://starzplay.com/en/landing',
en: 'https://starzplay.com/en/landing'
},

/* ---- CleverTap Liquid injection ----------------------------------------
Rendered SERVER-SIDE by CleverTap before the HTML reaches the webview.
Verified syntax: {{Campaign.campaignId | default:"0_0"}}.
If CleverTap does NOT render it (dashboard preview, HTML sanitisation, or
a non-personalised send) the raw "{{...}}" text survives into the string.
liquid() below detects that and drops the value rather than shipping
literal braces in the querystring.
DO NOT put Identity, email or phone here — click_id is the join key, so
no personal data needs to travel in the URL at all. */
ctCampaignIdRaw: '{{Campaign.campaignId | default:"0_0"}}',

/* ---- Images: all verified live (26/26 loaded, dimensions checked) ------ */

/* Serie A crowd backdrop, 1000x879, already fades to black.

/* ==========================================================================
CLEVERTAP BRIDGE

Verified against CleverTap's current docs (see README "Docs used").
Targeting is Android-only for this flight, but the iOS path is kept: it is
~15 lines, it is verified correct, and stripping it would only have to be
rewritten if iOS is ever enabled.

Android : global object `window.CleverTap`
pushEvent(name, JSON_STRING)
triggerInAppAction(JSON_STRING, callToAction, buttonId)
dismissInAppNotification()

iOS : window.webkit.messageHandlers.clevertap.postMessage({...})
{action:'recordEventWithProps', event, properties} <- JS OBJECT
{action:'triggerInAppAction', actionJson, callToAction, buttonId}
{action:'dismissInAppNotification'}

Android takes JSON STRINGS because an @JavascriptInterface method cannot
receive a JS object at all. iOS takes real objects. Sending the wrong one
silently drops every property, so the paths are kept separate.
========================================================================== */
var Bridge = (function () {
var log = [], cached, cachedDone = false;

function note(m) {
log.push(m);
if (CONFIG.debug) {
var el = document.getElementById('spDebug');
if (el) { el.classList.add('is-on'); el.textContent = log.join('\n'); }
}
try { console.log('[CT] ' + m); } catch (e) {}
}

function resolve() {
if (cachedDone) return cached;
cachedDone = true; cached = null;
var names = ['clevertap', 'CleverTap'], i;

/* Android first: a real object exposing pushEvent. */
for (i = 0; i < names.length; i++) {
try {
var o = window[names[i]];
if (o && typeof o.pushEvent === 'function') {
cached = { kind: 'android', obj: o, name: 'window.' + names[i] };
note('bridge = ANDROID via ' + cached.name); return cached;
}
} catch (e) {}
}
/* iOS: WKScriptMessageHandler. Docs use lowercase `clevertap`. */
try {
var mh = window.webkit && window.webkit.messageHandlers;
if (mh) {
for (i = 0; i < names.length; i++) {
if (mh[names[i]] && typeof mh[names[i]].postMessage === 'function') {
cached = { kind: 'ios', handler: mh[names[i]],
name: 'webkit.messageHandlers.' + names[i] };
note('bridge = IOS via ' + cached.name); return cached;
}
}
note('webkit.messageHandlers present but no clevertap key. keys=' +
Object.keys(mh).join(','));
}
} catch (e) { note('iOS probe threw: ' + e); }

note('NO BRIDGE FOUND (running outside the app?)');
return cached;
}

function post(msg, label) {
var b = resolve();
if (!b || b.kind !== 'ios') return false;
try { b.handler.postMessage(msg); note('iOS ' + label + ' OK'); return true; }
catch (e) { note('iOS ' + label + ' threw: ' + e); return false; }
}

function pushEvent(name, props) {
var b = resolve();
if (!b) { note('WOULD FIRE ' + name + ' ' + JSON.stringify(props)); return false; }
if (b.kind === 'android') {
try { b.obj.pushEvent(name, JSON.stringify(props)); note('AND pushEvent OK ' + name); return true; }
catch (e) { note('AND pushEvent threw: ' + e); return false; }
}
return post({ action: 'recordEventWithProps', event: name, properties: props }, 'pushEvent ' + name);
}

/* Opens the URL OUTSIDE the webview. Android resolves open-url through
Intent.ACTION_VIEW; iOS through the system opener.

`type` is "open-url" and the URL is repeated under android / ios / url.
The Android SDK doc shows the "android" key; the iOS doc page shows an
"ios" key. Extra keys are ignored by both parsers, so sending all three
removes the guess. Returns true only if a bridge actually accepted it. */
function openUrl(url, cta, buttonId) {
var b = resolve();
var actionJson = { type: 'open-url', android: url, ios: url, url: url };

if (!b) { note('WOULD OPEN ' + url); return false; }

if (b.kind === 'android') {
if (typeof b.obj.triggerInAppAction !== 'function') {
note('AND triggerInAppAction MISSING — SDK too old (needs 7.x+)');
return false;
}
try {
b.obj.triggerInAppAction(JSON.stringify(actionJson), cta, buttonId);
note('AND triggerInAppAction OK -> ' + url); return true;
} catch (e) { note('AND triggerInAppAction threw: ' + e); return false; }
}
return post({ action: 'triggerInAppAction', actionJson: actionJson,
callToAction: cta, buttonId: buttonId }, 'openUrl');
}

function dismiss() {
var b = resolve();
if (!b) {
note('no bridge — DOM hide only');
var r = document.getElementById('spRoot'); if (r) r.style.display = 'none';
return;
}
if (b.kind === 'android') {
try { b.obj.dismissInAppNotification(); note('AND dismiss OK'); }
catch (e) { note('AND dismiss threw: ' + e); }
return;
}
post({ action: 'dismissInAppNotification' }, 'dismiss');
}

return { pushEvent: pushEvent, openUrl: openUrl, dismiss: dismiss, note: note };
})();

/* ==========================================================================
LIQUID + URL

liquid() is the "no undefined in the querystring" guard. It rejects:
- unrendered Liquid (still contains braces)
- empty / whitespace-only
- the literal strings "undefined" / "null"
========================================================================== */
function liquid(raw) {
if (typeof raw !== 'string') return '';
var v = raw.trim();
if (!v) return '';
if (v.indexOf('{{') !== -1 || v.indexOf('}}') !== -1) return '';
if (v === 'undefined' || v === 'null') return '';
return v;
}
/* "0_0" is CleverTap's documented fallback and means "rendered, but no
campaign". Kept in the EVENT payload, because a stream of campaign_id="0_0"
is how you spot a misconfigured send. Stripped from the URL, because a fake
ID in a querystring is worse than an absent one. */
function ctCampaignIdForEvent() { return liquid(CONFIG.ctCampaignIdRaw) || 'unset'; }
function ctCampaignIdForUrl() {
var v = liquid(CONFIG.ctCampaignIdRaw);
return (v === '0_0') ? '' : v;
}

function makeClickId() {
var rnd = '', i;
try {
var a = new Uint8Array(8);
(window.crypto || window.msCrypto).getRandomValues(a);
for (i = 0; i < a.length; i++) rnd += ('0' + a[i].toString(16)).slice(-2);
} catch (e) {
rnd = Math.random().toString(16).slice(2, 10) + Math.random().toString(16).slice(2, 10);
}
return 'ct' + Date.now().toString(36) + rnd;
}

/* Shared by the DCB CTA and the "not a Maroc Telecom customer" link, so both
destinations are attributed the same way. */
function buildUrl(base, clickId, extraPairs) {
var pairs = [
['utm_source', 'clevertap'],
['utm_medium', 'inapp'],
['utm_campaign', CONFIG.utmCampaign],
['utm_content', CONFIG.variant + '_' + CONFIG.lang],
['click_id', clickId],
['ct_campaign_id', ctCampaignIdForUrl()],
/* Explicit copies of variant and language. utm_content already encodes
both, but string-splitting a utm field in the warehouse is brittle and
these two drive the whole A/B read. Drop them if you would rather not
carry the redundancy. */
['sp_variant', CONFIG.variant],
['sp_lang', CONFIG.lang]
];
if (extraPairs) pairs = pairs.concat(extraPairs);

var q = [], i, k, v;
for (i = 0; i < pairs.length; i++) {
k = pairs[i][0]; v = pairs[i][1];
if (v === null || v === undefined) continue;
v = String(v).trim();
if (!v || v === 'undefined' || v === 'null') continue;
q.push(encodeURIComponent(k) + '=' + encodeURIComponent(v));
}
return base + (base.indexOf('?') === -1 ? '?' : '&') + q.join('&');
}

function dcbUrl(clickId) {
var base = CONFIG.destUrl;
if (CONFIG.localiseDestPath && CONFIG.destPathByLang[CONFIG.lang]) {
base = CONFIG.destPathByLang[CONFIG.lang];
}
return buildUrl(base, clickId);
}
function altUrl(clickId) {
var base = CONFIG.landingByLang[CONFIG.lang] || CONFIG.landingByLang.en;
return buildUrl(base, clickId, [['sp_route', 'non_carrier']]);
}

/* Tiles are rendered TWICE so the marquee loops seamlessly.

Image failure is handled per URL, not per tile: if a source 404s, BOTH of
its copies are hidden together. Hiding only one would make the two halves of
the track different widths, so the fixed keyframe shift would no longer land
on a whole repeat and the loop would visibly jump. If every source fails the
strip is removed entirely rather than leaving a band of empty boxes. */
function buildReel(reelEl, trackEl, urls) {
urls = urls || [];
if (!urls.length) { reelEl.classList.add('is-empty'); return; }

var aliveUrls = urls.length;
var frag = document.createDocumentFragment();
var pass, i;

function killUrl(idx) {
var dead = trackEl.querySelectorAll('[data-idx="' + idx + '"]');
if (!dead.length || dead[0].classList.contains('is-dead')) return;
for (var d = 0; d < dead.length; d++) dead[d].classList.add('is-dead');
if (--aliveUrls <= 0) reelEl.classList.add('is-empty');
}

for (pass = 0; pass < 2; pass++) {
for (i = 0; i < urls.length; i++) {
var tile = document.createElement('div');
tile.className = 'sp-tile';
tile.setAttribute('data-idx', String(i));
var img = document.createElement('img');
img.alt = ''; img.decoding = 'async';
img.setAttribute('data-idx', String(i));
img.addEventListener('error', function () {
killUrl(this.getAttribute('data-idx'));
});
img.src = urls[i];
tile.appendChild(img);
frag.appendChild(tile);
}
}
trackEl.appendChild(frag);
}

/* Both outbound taps share this. `which` distinguishes the DCB trial route
from the non-carrier landing route; they are separate action values so the
click-to-trial denominator stays clean. */
function onOutbound(e, which) {
if (state.done) { if (e) e.preventDefault(); return; }
state.done = true;
state.clickId = makeClickId();

var isDcb = which === 'dcb';
var url = isDcb ? dcbUrl(state.clickId) : altUrl(state.clickId);
var el = isDcb ? els.cta : els.alt;
var btnId = isDcb ? ('cta_dcb_' + CONFIG.variant) : ('cta_landing_' + CONFIG.variant);
var label = isDcb ? T.cta : T.altLink;

el.setAttribute('href', url);

/* Fire BEFORE handing off — once the external browser takes focus the
webview may be torn down mid-flush. */
fireEvent(isDcb ? 'cta_clicked' : 'secondary_cta_clicked', {
destination_url: url,
click_id: state.clickId,
link_target: isDcb ? 'maroc_telecom_dcb' : 'non_carrier_landing'
});

var opened = Bridge.openUrl(url, label, btnId);

if (opened) {
/* Bridge accepted it. Suppress the anchor so the URL does not ALSO load
inside the webview, then dismiss once events have had time to flush. */
if (e) e.preventDefault();
window.setTimeout(function () {
fireEvent('dismissed', { dismiss_method: isDcb ? 'cta_handoff' : 'secondary_cta_handoff' });
window.setTimeout(Bridge.dismiss, CONFIG.bridgeSettleMs);
}, CONFIG.bridgeSettleMs);
} else {
/* triggerInAppAction unavailable (old SDK) or no bridge. Let the anchor
navigate — the webview's own URL handler is the last chance at an
external launch. Do NOT dismiss: killing the in-app here would cancel
the navigation and strand the user on nothing. */
Bridge.note('openUrl failed — falling through to anchor navigation');
state.done = false;
}
}

function onDismiss() {
if (state.done) return;
state.done = true;
fireEvent('dismissed', { dismiss_method: 'not_now_button' });
window.setTimeout(Bridge.dismiss, CONFIG.bridgeSettleMs);
}

var from = CONFIG.lang;
state.langSwitches++;
/* Fire while `language` still reads as the language being LEFT. */
fireEvent('language_switched', { language_from: from, language_to: lang });
CONFIG.lang = lang;
applyLocale();
}

pre.onload = function () {
els.hero.style.backgroundImage = 'url("' + CONFIG.heroUrl + '")';
els.hero.classList.add('is-on');
};
pre.onerror = function () { Bridge.note('hero failed: ' + CONFIG.heroUrl); };
pre.src = CONFIG.heroUrl;
}

function boot() {
if (CONFIG.debug) document.getElementById('spDebug').classList.add('is-on');
if (CONFIG.variant === 'B') els.root.classList.add('is-priced');

loadHero();
var reel = CONFIG.reelUrls || [];
buildReel(els.reelA, els.reelTrackA, reel);
buildReel(els.reelB, els.reelTrackB, CONFIG.reelUrlsB || []);

/* Image failure must never cost readability or the CTA. Comp logo hides
itself; the operator mark swaps to a text wordmark so the Maroc Telecom
requirement is still stated. */
els.compLogo.addEventListener('error', function () { els.compLogo.style.display = 'none'; });
els.opLogo.addEventListener('error', function () { els.fine.classList.add('is-noimg'); });
if (!CONFIG.opLogoUrl) els.fine.classList.add('is-noimg');
else els.opLogo.src = CONFIG.opLogoUrl;

applyLocale();

els.langAr.addEventListener('click', function () { setLang('ar'); });
els.langFr.addEventListener('click', function () { setLang('fr'); });
els.langEn.addEventListener('click', function () { setLang('en'); });
els.cta.addEventListener('click', function (e) { onOutbound(e, 'dcb'); });
els.alt.addEventListener('click', function (e) { onOutbound(e, 'landing'); });
els.dismiss.addEventListener('click', onDismiss);

els.root.classList.add('is-ready');

/* 'shown', not 'viewed' — matches the 10,348 existing web_exitpop_clm rows.
See README property-conflict table. */
fireEvent('shown');
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
</script>
</body>
</html>
